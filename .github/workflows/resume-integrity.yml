name: Validate resume claim integrity

on:
  pull_request:
    paths:
      - ".github/workflows/resume-integrity.yml"
      - ".codex/**"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/data-and-evidence-governance.md"
      - "tailored-resume-generator/**"
  push:
    paths:
      - ".github/workflows/resume-integrity.yml"
      - ".codex/**"
      - ".gitignore"
      - "AGENTS.md"
      - "docs/data-and-evidence-governance.md"
      - "tailored-resume-generator/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run resume-integrity tests
        run: python3 -m unittest discover -s tailored-resume-generator/tests -v

      - name: Compile Python checks
        run: |
          python3 -m py_compile \
            tailored-resume-generator/scripts/validate_claims.py \
            tailored-resume-generator/tests/test_claim_integrity.py

      - name: Validate fixture and configuration syntax
        run: |
          python3 tailored-resume-generator/scripts/validate_claims.py \
            tailored-resume-generator/tests/fixtures/unsafe-example.synthetic.json > /dev/null
          python3 -m json.tool \
            tailored-resume-generator/tests/fixtures/unsafe-example.synthetic.json > /dev/null
          python3 - <<'PY'
          import tomllib
          from pathlib import Path

          with Path(".codex/config.toml").open("rb") as config:
              tomllib.load(config)
          PY
